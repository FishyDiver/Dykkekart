<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dykkekart</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤿</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">
<style>
:root{
  --bg:#F3F7FA; --panel:#FFFFFF; --ink:#0F2A3F; --muted:#587084; --line:#D3DFE8;
  --sea:#D7EBF8; --land:#EFE08A; --magenta:#B8246A; --kelp:#3F7F34; --alpha:#1F4FA8;
  --soft:#EAF2F7; --danger:#B3261E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1824; --panel:#10233A; --ink:#E3EDF4; --muted:#93A9BB; --line:#23405B;
    --sea:#0E2234; --land:#6E6530; --magenta:#EE5C9E; --kelp:#76B866; --alpha:#6E9BFF;
    --soft:#16304A; --danger:#FF8A80;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1824; --panel:#10233A; --ink:#E3EDF4; --muted:#93A9BB; --line:#23405B;
  --sea:#0E2234; --land:#6E6530; --magenta:#EE5C9E; --kelp:#76B866; --alpha:#6E9BFF;
  --soft:#16304A; --danger:#FF8A80;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:15px/1.5 Barlow,"Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;margin:0;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
img{max-width:100%}

.top{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:26px;font-weight:700}
#tabs{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0}
.tab{border:0;background:none;padding:6px 14px;border-radius:999px;color:var(--muted);white-space:nowrap;font-weight:500}
.tab:hover{background:var(--soft);color:var(--ink)}
.tab.on{background:var(--ink);color:var(--panel)}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--magenta);border-color:var(--magenta);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:transparent;background:var(--soft)}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:default}

.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 410px}
.mapcol{display:flex;flex-direction:column;min-width:0;min-height:0}
.wrap{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--sea);touch-action:none;cursor:grab}
.wrap.dragging{cursor:grabbing}
.wrap.placing{cursor:crosshair}
.inner{position:absolute;left:0;top:0;transform-origin:0 0;--inv:1}
.inner img{display:block;width:100%;user-select:none;-webkit-user-drag:none;pointer-events:none;border-radius:2px;box-shadow:0 0 0 1px var(--line)}
#pins{position:absolute;inset:0}
.pin{position:absolute;width:30px;height:36px;padding:0;border:0;background:none;
  transform:translate(-4px,-34px) scale(var(--inv));transform-origin:4px 34px}
.pin svg{display:block;overflow:visible}
.pin .blue{fill:var(--alpha)}
.pin.priv .blue{fill:var(--magenta)}
.pin .lbl{position:absolute;left:30px;top:-2px;white-space:nowrap;background:var(--panel);color:var(--ink);
  font-weight:600;font-size:13px;padding:1px 7px;border-radius:4px;border:1px solid var(--line);display:none;pointer-events:none}
.pin:hover .lbl,.pin.sel .lbl,.pin:focus-visible .lbl{display:block}
.pin.sel svg{filter:drop-shadow(0 0 3px var(--magenta)) drop-shadow(0 0 1px var(--magenta))}
.pin.draft{opacity:.75;pointer-events:none}
.pin.draft .lbl{display:block}

.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;pointer-events:none}
.overlay>div{max-width:420px;pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px}
.overlay h2{font-size:24px;margin-bottom:8px}
.overlay p{color:var(--muted);margin:0 0 14px}

.maptools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;background:var(--panel);border-top:1px solid var(--line)}
#hint{color:var(--magenta);font-weight:600;flex:1;min-width:120px}
.legend{display:flex;gap:12px;color:var(--muted);font-size:13px;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.zoom{display:flex;gap:4px}
.zoom .btn{padding:5px 11px}

.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-height:0;padding:18px 20px 40px}
.panel h2{font-size:30px;font-weight:700}
.sub{color:var(--muted);margin:4px 0 0}
.back{margin:-6px 0 10px -10px}
.search{width:100%;margin:16px 0 8px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.chips{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 12px;font-size:14px;color:var(--muted)}
.chip.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.row{display:flex;width:100%;text-align:left;gap:12px;align-items:flex-start;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 4px}
.row:hover{background:var(--soft)}
.row .nm{font-weight:600;font-size:16px}
.row .mt{color:var(--muted);font-size:13.5px}
.row .rt{margin-left:auto;text-align:right;font-size:13px;color:var(--muted);white-space:nowrap}
.flagdot{flex:none;margin-top:4px}
.emptytxt{color:var(--muted);padding:18px 0}

.tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.tag{font-size:13px;padding:2px 9px;border-radius:4px;background:var(--soft);color:var(--ink)}
.tag.p{background:var(--magenta);color:#fff}
.photo{width:100%;border-radius:8px;margin:4px 0 14px;display:block}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:0 0 16px}
.facts div{border-top:2px solid var(--ink);padding-top:4px}
.facts dt{font-size:13px;color:var(--muted)}
.facts dd{margin:0;font-weight:600;white-space:pre-wrap}
.windbox{display:flex;gap:14px;align-items:center;margin:4px 0 16px;padding:10px;background:var(--soft);border-radius:10px}
.windbox p{margin:0;font-size:14px}
.windbox strong{display:block;font-family:"Barlow Condensed",sans-serif;font-size:18px}
.sec{margin:0 0 14px}
.sec h3{font-size:18px;font-weight:600;margin-bottom:2px}
.sec p{margin:0;white-space:pre-wrap}
.sec.warn h3{color:var(--danger)}
.coords{font-variant-numeric:tabular-nums}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.links a{color:var(--alpha);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0 8px;text-align:center}
.stats b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:26px;line-height:1}
.stats span{font-size:12px;color:var(--muted)}
.spark{margin:4px 0 12px}
.spark text{fill:var(--muted);font-size:10px}
.logs h3{font-size:22px;margin:18px 0 8px;display:flex;align-items:center;justify-content:space-between}
.log{border-left:3px solid var(--alpha);padding:4px 0 4px 12px;margin:0 0 12px}
.log .d{font-weight:600}
.log .m{color:var(--muted);font-size:13.5px}
.log p{margin:3px 0 0;white-space:pre-wrap}
.log .x{float:right;font-size:13px;padding:2px 6px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}

form.f label{display:block;font-size:13.5px;color:var(--muted);margin:12px 0 3px}
form.f input[type=text],form.f input[type=number],form.f input[type=date],form.f select,form.f textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
form.f textarea{min-height:62px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 8px}
.rating{display:flex;gap:4px}
.rating button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:none;font-weight:600}
.rating button.on{background:var(--kelp);border-color:var(--kelp);color:#fff}
.radios{display:flex;gap:14px;flex-wrap:wrap}
.radios label{display:flex;gap:6px;align-items:center;margin:0;color:var(--ink);font-size:15px}
.formbtns{display:flex;gap:8px;margin-top:18px;position:sticky;bottom:-40px;background:var(--panel);padding:10px 0}
.err{color:var(--danger);font-size:14px;margin-top:8px}
.logform{background:var(--soft);padding:4px 12px 12px;border-radius:10px;margin-bottom:14px}
.rose path{cursor:default}
.rose.edit path{cursor:pointer}
.rose text{fill:var(--muted);font-size:10px;font-weight:600;text-anchor:middle;dominant-baseline:middle}

#frames{position:absolute;inset:0;pointer-events:none}
.frame{position:absolute;border:calc(2px*var(--inv)) dashed var(--magenta);background:color-mix(in srgb,var(--magenta) 6%,transparent);pointer-events:auto;cursor:zoom-in;border-radius:calc(3px*var(--inv))}
.frame:hover{background:color-mix(in srgb,var(--magenta) 14%,transparent)}
.frame span{position:absolute;left:0;top:0;transform:scale(var(--inv));transform-origin:0 0;background:var(--magenta);color:#fff;font-weight:600;font-size:12px;padding:1px 6px;border-radius:0 0 4px 0;white-space:nowrap}
#coord{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.small{font-size:13.5px;color:var(--muted);margin:8px 0 0}
details.geo{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details.geo summary{cursor:pointer;font-weight:600}
.ok{color:var(--kelp);font-weight:600;font-size:14px;margin-top:8px}
.home{font-size:12px;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);max-width:min(440px,92vw);width:100%;padding:22px}
dialog::backdrop{background:rgba(5,15,25,.5)}
dialog h2{font-size:26px}
dialog p{color:var(--muted);margin:6px 0 0}

@media (max-width:860px){
  .layout{grid-template-columns:1fr;grid-template-rows:minmax(300px,55%) auto;overflow-y:auto}
  .panel{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .legend{display:none}
  .brand h1{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#lmap{flex:1;min-height:0;background:var(--sea)}
#lmap[hidden],#wrap[hidden]{display:none}
.leaflet-container{font:inherit}
.lp{background:none;border:0}
.lp svg{display:block;overflow:visible}
.lp .lbl{position:absolute;left:30px;top:-2px;white-space:nowrap;background:var(--panel);color:var(--ink);font-weight:600;font-size:13px;padding:1px 7px;border-radius:4px;border:1px solid var(--line);display:none;pointer-events:none}
.lp:hover .lbl,.lp.sel .lbl,.lp.draft .lbl{display:block}
.lp.sel svg{filter:drop-shadow(0 0 3px var(--magenta)) drop-shadow(0 0 1px var(--magenta))}
.leaflet-tooltip.ftip{background:var(--magenta);color:#fff;border:0;font-weight:600;padding:1px 6px;box-shadow:none}
.leaflet-tooltip.ftip::before{display:none}
.auth{position:fixed;inset:0;z-index:2000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.auth[hidden]{display:none}
.auth .box{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px}
.auth h1{font-size:34px;margin:10px 0 4px}
.auth p{color:var(--muted);margin:0 0 6px}
.linkbtn{background:none;border:0;color:var(--alpha);font-weight:600;padding:0;margin-top:14px}
.mrow{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:8px 0;gap:8px}
.mrow small{color:var(--muted)}
.menu-sec{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
.menu-sec h3{font-size:19px;margin-bottom:6px}
.unpos{margin-top:22px}
.unpos h3{font-size:18px;margin-bottom:2px}
[hidden]{display:none!important}
#drawBar,.dgrp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw{display:inline-block;width:13px;height:13px;border-radius:3px;border:1px solid rgba(0,0,0,.25);vertical-align:-2px}
.leaflet-draw-tooltip{font:13px Barlow,system-ui,sans-serif}
.cdot{position:absolute;left:12px;top:-5px;width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);pointer-events:none}
.flagdot{position:relative}.flagdot .cdot{left:8px;top:-4px;width:9px;height:9px;border-width:1.5px}
.cond{background:var(--soft);border-radius:10px;padding:10px 12px;margin:0 0 16px}
.cnow{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.cnow strong{display:block;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:19px}
.ctide{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:8px;font-size:14px}.ctide small{color:var(--muted)}
.cwin{margin:2px 0 0}
#condSel{padding:6px 10px}
#errBar{position:fixed;left:12px;right:12px;bottom:12px;z-index:3000;background:#B3261E;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,.3)}
#errBar button{float:right;background:none;border:0;color:#fff;font-weight:700}
.ver{color:var(--muted);font-size:12px;margin-left:4px}
.vbadge{position:absolute;left:16px;top:22px;background:var(--ink);color:var(--panel);font-size:11px;font-weight:700;padding:0 5px;border-radius:8px;white-space:nowrap;pointer-events:none;line-height:16px}
.vtxt{color:var(--alpha)}
.visq{background:var(--soft);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.vbig{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:20px;color:var(--alpha)}.vbig.old{color:var(--muted)}
.vform{display:grid;grid-template-columns:90px 1fr auto;gap:6px}
.vform input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.crow{display:grid;grid-template-columns:1fr 80px 52px 58px 30px;gap:4px;margin-bottom:4px}
.crow input,.crow select{width:100%;padding:6px 7px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.crow .btn{padding:0}
.sptab{width:100%;border-collapse:collapse;font-size:14px}
.sptab th{text-align:left;color:var(--muted);font-weight:500;font-size:12.5px;border-bottom:1px solid var(--line);padding:3px 4px}
.sptab td{border-bottom:1px solid var(--line);padding:5px 4px;vertical-align:middle}
.spsel{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin-bottom:8px}
.feed{margin:4px 0 10px}.feed h3{font-size:18px;margin-bottom:4px}
.frow{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:6px 4px}
.frow:hover{background:var(--soft)}.frow b{color:var(--alpha);display:inline-block;min-width:46px}
@media (max-width:480px){.vform{grid-template-columns:80px 1fr}.vform .btn{grid-column:1/-1}.crow{grid-template-columns:1fr 74px 46px 52px 26px}}
</style>
</head>
<body>
<div id="auth" class="auth" hidden><div class="box" id="authBox"></div></div>

<header class="top">
  <div class="brand">
    <svg width="26" height="30" viewBox="0 0 30 36" aria-hidden="true"><path d="M5 2H15V20H5Z" fill="#fff" stroke="currentColor" stroke-width="1.2"/><path d="M15 2H28L22 11L28 20H15Z" fill="var(--alpha)" stroke="currentColor" stroke-width="1.2"/><path d="M4 1V34" stroke="currentColor" stroke-width="2"/></svg>
    <h1>Dykkekart</h1><span class="ver">v4</span>
  </div>
  <nav id="tabs" aria-label="Kartblad"></nav>
  <button id="addChartBtn" class="btn">Nytt kartblad</button>
  <button id="menuBtn" class="btn ghost">Meny</button>
</header>

<main class="layout">
  <section class="mapcol">
    <div id="lmap"></div>
    <div id="wrap" class="wrap" hidden>
      <div id="inner" class="inner"><img id="chartImg" alt=""><div id="frames"></div><div id="pins"></div></div>
      <div id="overlay" class="overlay" hidden></div>
    </div>
    <div class="maptools">
      <button id="placeBtn" class="btn primary">Nytt dykkested</button>
      <button id="drawBtn" class="btn">Tegn område</button>
      <select id="condSel" class="btn" aria-label="Vis vindforhold på kartet"><option value="off">Forhold: av</option><option value="now">Forhold nå</option><option value="+3">Om 3 timer</option><option value="+6">Om 6 timer</option><option value="d1h10">I morgen kl 10</option><option value="d1h15">I morgen kl 15</option><option value="d2h10">Overmorgen kl 10</option></select>
      <span id="drawBar" hidden><span class="dgrp" id="dPick"><button class="btn" id="dPoly">Polygon</button><button class="btn" id="dLine">Linje</button><button class="btn" id="dRect">Rektangel</button></span><button class="btn" id="dUndo">Angre punkt</button><button class="btn primary" id="dDone">Ferdig</button><button class="btn ghost" id="dCancel">Avbryt</button></span>
      <span id="hint"></span><span id="coord"></span>
      <div class="legend"><span><i style="background:var(--alpha)"></i>Delt</span><span><i style="background:var(--magenta)"></i>Bare for deg</span></div>
      <div class="zoom" id="imgZoom"><button class="btn" id="zin" aria-label="Zoom inn">+</button><button class="btn" id="zout" aria-label="Zoom ut">−</button><button class="btn" id="zfit">Hele kartet</button></div>
    </div>
  </section>
  <aside id="panel" class="panel"></aside>
</main>

<dialog id="chartDlg">
  <form class="f" id="chartForm" method="dialog">
    <h2 id="cTitle">Nytt kartblad</h2>
    <p id="cIntro">Et skjermbilde eller en eksport av et kart for et område. Dykkestedene plasseres oppå bildet.</p>
    <label for="cName">Navn på området</label>
    <input type="text" id="cName" required placeholder="F.eks. Saltstraumen">
    <div id="cFileWrap"><label for="cFile">Bilde (JPG, PNG eller WebP)</label>
    <input type="file" id="cFile" accept="image/png,image/jpeg,image/webp"></div>
    <details class="geo" id="geoBox"><summary>Georeferering (valgfritt)</summary>
      <p class="small">Georefererte kartblad gir dykkestedene koordinater automatisk, og vises som rammer på sjøkartet.</p>
      <label for="cWorld">World-fil fra QGIS (.jgw, .pgw, .wld)</label>
      <input type="file" id="cWorld" accept=".jgw,.pgw,.wld,.tfw,.jpgw,.pngw,.txt">
      <p class="small">Eller oppgi hjørnene på bildet:</p>
      <label for="cProj">Kartprojeksjon</label>
      <select id="cProj"><option value="25833">Norgeskart (UTM 33)</option><option value="3857">Web-kart (Google, Navionics, OSM)</option></select>
      <div class="two"><div><label for="cTLlat">Øvre venstre, breddegrad</label><input type="text" id="cTLlat" inputmode="decimal" placeholder="67.60"></div><div><label for="cTLlon">lengdegrad</label><input type="text" id="cTLlon" inputmode="decimal" placeholder="13.90"></div></div>
      <div class="two"><div><label for="cBRlat">Nedre høyre, breddegrad</label><input type="text" id="cBRlat" inputmode="decimal" placeholder="66.95"></div><div><label for="cBRlon">lengdegrad</label><input type="text" id="cBRlon" inputmode="decimal" placeholder="15.40"></div></div>
      <div id="cGeoStatus"></div>
      <label style="display:flex;gap:6px;align-items:center" id="cClearWrap"><input type="checkbox" id="cClear"> Fjern georefereringen</label>
    </details>
    <div class="err" id="cErr"></div>
    <div class="formbtns"><button type="submit" class="btn primary" id="cSave">Lagre kartblad</button><button type="button" class="btn ghost" id="cCancel">Avbryt</button></div>
  </form>
</dialog>

<div id="errBar" hidden></div>
<dialog id="menuDlg"><div id="menuBody"></div></dialog>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
/* ================= Dykkekart (Supabase-versjon) ================= */
const APP_VERSION="v4 (områder, vær og tidevann, fangst og sikt)";
function showErr(m){try{const b=document.getElementById("errBar");if(!b)return;b.hidden=false;b.innerHTML=`<button aria-label="Lukk" onclick="this.parentNode.hidden=true">×</button>Noe gikk galt: ${String(m).replace(/[<>&]/g,"")}. Ta et skjermbilde og send det til Claude.`}catch(e){}}
window.addEventListener("error",e=>showErr(e.message+(e.lineno?` (linje ${e.lineno})`:"")));
window.addEventListener("unhandledrejection",e=>showErr(e.reason&&(e.reason.message||e.reason)||"ukjent feil"));
const CFG=window.DYKKEKART_CONFIG||{};
const BUCKET="dykkekart";
const DIRS=["N","NØ","Ø","SØ","S","SV","V","NV"];
const ACCESS={land:"Fra land",bat:"Fra båt",begge:"Land og båt"};
const LIVE={id:"live",name:"Sjøkart"};
const S={user:null,me:null,members:[],charts:[],sites:[],active:"live",sel:null,mode:"view",view:"list",
  logs:[],logsFor:null,zoom:1,maxZoom:8,px:0,py:0,q:"",acc:"alle",draft:null,imgFor:null,dlgChart:null,lmap:null,lLayer:null,fLayer:null,started:false};
const $=s=>document.querySelector(s);
const wrap=$("#wrap"),inner=$("#inner"),img=$("#chartImg"),pinsEl=$("#pins"),framesEl=$("#frames"),panel=$("#panel"),lmapEl=$("#lmap");
let sb=null;

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function num(v){if(v===""||v==null)return null;const n=parseFloat(String(v).trim().replace(",","."));return isFinite(n)?n:null}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fdate(d,short){if(!d)return"";try{return new Date(d+"T12:00:00").toLocaleDateString("nb-NO",short?{day:"numeric",month:"short"}:{day:"numeric",month:"short",year:"numeric"})}catch(e){return d}}
function fnum(n,dec=0){return n==null?"":Number(n).toLocaleString("nb-NO",{maximumFractionDigits:dec})}
function flagSVG(priv,size=30){const h=size*36/30;return `<svg width="${size}" height="${h}" viewBox="0 0 30 36" aria-hidden="true"><path d="M5 2H15V20H5Z" fill="#fff" stroke="#0F2A3F" stroke-width="1.2"/><path d="M15 2H28L22 11L28 20H15Z" style="fill:var(${priv?"--magenta":"--alpha"})" stroke="#0F2A3F" stroke-width="1.2"/><path d="M4 1V34" stroke="#0F2A3F" stroke-width="2.2"/><circle cx="4" cy="34" r="2.4" fill="#0F2A3F"/></svg>`}
function errMsg(e){return (e&&(e.message||e.error_description||e.code))||String(e)}
function imgUrl(path){return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl}
function newPath(file){const ext=(file.name&&file.name.includes(".")?file.name.split(".").pop():"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");return `${S.user.id}/${crypto.randomUUID()}.${ext||"jpg"}`}
async function uploadImage(file){if(file.size>45*1024*1024)throw{message:"Bildet er større enn 45 MB."};const path=newPath(file);
  const {error}=await sb.storage.from(BUCKET).upload(path,file,{contentType:file.type||"image/jpeg",upsert:false});if(error)throw error;return path}

/* ---------- mapping db <-> app ---------- */
function rowToSite(r){return{id:r.id,chartId:r.chart_id,x:r.x,y:r.y,lat:r.lat,lon:r.lon,name:r.name,access:r.access,maxDepth:r.max_depth,bottom:r.bottom,tide:r.tide,season:r.season,
  wind:r.wind||[],hazards:r.hazards,rules:r.rules,species:r.species,notes:r.notes,rating:r.rating,photoPath:r.photo_path,_priv:r.private,createdBy:r.created_by,
  logCount:r.log_count||0,lastDive:r.last_dive,visAvg:r.vis_avg,tideMode:r.tide_mode||"none",tideOffset:r.tide_offset||0,tideWidth:r.tide_width||60}}
function rowToChart(r){return{id:r.id,name:r.name,imagePath:r.image_path,w:r.w,h:r.h,geo:r.geo,createdBy:r.created_by}}

/* ---------- projections ---------- */
const RAD=Math.PI/180,A_=6378137,F_=1/298.257223563,E2=F_*(2-F_),EP2=E2/(1-E2),K0=0.9996,L0=15*RAD;
function utmFwd(lat,lon){const p=lat*RAD,sp=Math.sin(p),cp=Math.cos(p),tp=Math.tan(p);
  const N=A_/Math.sqrt(1-E2*sp*sp),T=tp*tp,C=EP2*cp*cp,A=cp*(lon*RAD-L0),e4=E2*E2,e6=e4*E2;
  const M=A_*((1-E2/4-3*e4/64-5*e6/256)*p-(3*E2/8+3*e4/32+45*e6/1024)*Math.sin(2*p)+(15*e4/256+45*e6/1024)*Math.sin(4*p)-(35*e6/3072)*Math.sin(6*p));
  const x=K0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*EP2)*A**5/120)+500000;
  const y=K0*(M+N*tp*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*EP2)*A**6/720));return[x,y]}
function utmInv(x,y){const e4=E2*E2,e6=e4*E2,M=y/K0,mu=M/(A_*(1-E2/4-3*e4/64-5*e6/256)),e1=(1-Math.sqrt(1-E2))/(1+Math.sqrt(1-E2));
  const p1=mu+(3*e1/2-27*e1**3/32)*Math.sin(2*mu)+(21*e1*e1/16-55*e1**4/32)*Math.sin(4*mu)+(151*e1**3/96)*Math.sin(6*mu)+(1097*e1**4/512)*Math.sin(8*mu);
  const s1=Math.sin(p1),c1=Math.cos(p1),t1=Math.tan(p1),N1=A_/Math.sqrt(1-E2*s1*s1),T1=t1*t1,C1=EP2*c1*c1,R1=A_*(1-E2)/Math.pow(1-E2*s1*s1,1.5),D=(x-500000)/(N1*K0);
  const lat=p1-(N1*t1/R1)*(D*D/2-(5+3*T1+10*C1-4*C1*C1-9*EP2)*D**4/24+(61+90*T1+298*C1+45*T1*T1-252*EP2-3*C1*C1)*D**6/720);
  const lon=L0+(D-(1+2*T1+C1)*D**3/6+(5-2*C1+28*T1-3*C1*C1+8*EP2+24*T1*T1)*D**5/120)/c1;return[lat/RAD,lon/RAD]}
function fwd(proj,lat,lon){if(proj==="25833")return utmFwd(lat,lon);if(proj==="3857")return[A_*lon*RAD,A_*Math.log(Math.tan(Math.PI/4+lat*RAD/2))];return[lon,lat]}
function inv(proj,x,y){if(proj==="25833")return utmInv(x,y);if(proj==="3857")return[(2*Math.atan(Math.exp(y/A_))-Math.PI/2)/RAD,x/A_/RAD];return[y,x]}
function llToFrac(g,lat,lon){const[x,y]=fwd(g.proj,lat,lon);return[(x-g.minX)/(g.maxX-g.minX),(g.maxY-y)/(g.maxY-g.minY)]}
function fracToLL(g,fx,fy){return inv(g.proj,g.minX+fx*(g.maxX-g.minX),g.maxY-fy*(g.maxY-g.minY))}
function chartCorners(c){const g=c.geo;return[[0,0],[1,0],[1,1],[0,1]].map(([a,b])=>fracToLL(g,a,b))}

/* ---------- auth ---------- */
function authScreen(kind,msg){
  const a=$("#auth"),b=$("#authBox");a.hidden=false;
  const logo=`<svg width="34" height="40" viewBox="0 0 30 36" aria-hidden="true"><path d="M5 2H15V20H5Z" fill="#fff" stroke="currentColor" stroke-width="1.2"/><path d="M15 2H28L22 11L28 20H15Z" fill="var(--alpha)" stroke="currentColor" stroke-width="1.2"/><path d="M4 1V34" stroke="currentColor" stroke-width="2"/></svg>`;
  if(kind==="config"){b.innerHTML=`${logo}<h1>Nesten klar</h1><p>Fyll inn Supabase-adressen og nøkkelen i <b>config.js</b>, og last siden på nytt.</p>`;return}
  if(kind==="notmember"){b.innerHTML=`${logo}<h1>Ikke invitert ennå</h1><p>Du er logget inn som <b>${esc(S.user.email)}</b>, men denne e-posten er ikke lagt til i dykkekartet. Be den som eier kartet legge deg til under Meny, Medlemmer.</p><button class="btn" id="aOut" style="margin-top:14px">Logg ut</button>`;$("#aOut").onclick=()=>sb.auth.signOut();return}
  if(kind==="name"){b.innerHTML=`${logo}<h1>Hva heter du?</h1><p>Navnet vises ved dykkene du logger.</p><form class="f" id="nf"><label for="aName">Navn</label><input type="text" id="aName" required><div class="err" id="aErr"></div><div style="margin-top:14px"><button class="btn primary">Fortsett</button></div></form>`;
    $("#nf").onsubmit=async e=>{e.preventDefault();const n=$("#aName").value.trim();const {error}=await sb.from("members").update({name:n}).eq("email",S.me.email);if(error){$("#aErr").textContent=errMsg(error);return}S.me.name=n;a.hidden=true;start()};$("#aName").focus();return}
  const signup=kind==="signup";
  b.innerHTML=`${logo}<h1>${signup?"Lag konto":"Logg inn"}</h1><p>${signup?"Bruk e-posten du ble invitert med.":"Dykkekart for deg og dykkekompisene."}</p>
  <form class="f" id="af"><label for="aEmail">E-post</label><input type="text" id="aEmail" inputmode="email" autocomplete="email" required>
  <label for="aPw">Passord${signup?" (minst 6 tegn)":""}</label><input type="password" id="aPw" autocomplete="${signup?"new-password":"current-password"}" required minlength="6">
  <div class="err" id="aErr">${esc(msg||"")}</div><div style="margin-top:14px"><button class="btn primary" id="aGo">${signup?"Lag konto":"Logg inn"}</button></div></form>
  <button class="linkbtn" id="aSwitch">${signup?"Har du konto? Logg inn":"Første gang? Lag konto"}</button>`;
  $("#aSwitch").onclick=()=>authScreen(signup?"login":"signup");
  $("#af").onsubmit=async e=>{e.preventDefault();const email=$("#aEmail").value.trim().toLowerCase(),password=$("#aPw").value;$("#aGo").disabled=true;$("#aErr").textContent="";
    const r=signup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
    $("#aGo").disabled=false;
    if(r.error){$("#aErr").textContent=r.error.message==="Invalid login credentials"?"Feil e-post eller passord.":errMsg(r.error);return}
    if(signup&&!r.data.session){$("#aErr").textContent="Kontoen er laget, men e-postbekreftelse er slått på i Supabase. Se oppsettguiden, steg 4.";}
  };
  $("#aEmail").focus();
}
async function onSession(session){
  if(!session){S.user=null;S.me=null;authScreen("login");return}
  S.user=session.user;
  const {data,error}=await sb.from("members").select("*");
  if(error){authScreen("login",errMsg(error));return}
  S.members=data||[];S.me=S.members.find(m=>m.email.toLowerCase()===S.user.email.toLowerCase())||null;
  if(!S.me){authScreen("notmember");return}
  if(!S.me.name){authScreen("name");return}
  $("#auth").hidden=true;start();
}
async function start(){
  if(S.started)return;S.started=true;
  initLeaflet();
  await Promise.all([loadCharts(),loadSites(),loadAreas().catch(e=>showErr("områder: "+errMsg(e))),loadCatches().catch(()=>{}),loadReports().catch(()=>{})]);
  renderTabs();renderChart();renderPanel();
  try{initCond()}catch(e){showErr("vær: "+errMsg(e))}
  sb.channel("dykkekart")
    .on("postgres_changes",{event:"*",schema:"public",table:"sites"},()=>debounced("sites",loadSites))
    .on("postgres_changes",{event:"*",schema:"public",table:"charts"},()=>debounced("charts",async()=>{await loadCharts();renderTabs();renderChart();if(S.view==="list")renderList()}))
    .on("postgres_changes",{event:"*",schema:"public",table:"catches"},()=>debounced("catches",loadCatches))
    .on("postgres_changes",{event:"*",schema:"public",table:"vis_reports"},()=>debounced("vis",loadReports))
    .on("postgres_changes",{event:"*",schema:"public",table:"areas"},()=>debounced("areas",loadAreas))
    .on("postgres_changes",{event:"*",schema:"public",table:"logs"},()=>debounced("logs",()=>{if(S.sel)loadLogs(S.sel)}))
    .subscribe();
  window.addEventListener("focus",()=>debounced("focus",async()=>{await loadSites();if(S.sel)loadLogs(S.sel)}));
}
const timers={};function debounced(k,fn){clearTimeout(timers[k]);timers[k]=setTimeout(fn,300)}
async function loadCharts(){const {data,error}=await sb.from("charts").select("*").order("created_at");if(!error){S.charts=data.map(rowToChart);if(S.active!=="live"&&!S.charts.find(c=>c.id===S.active))S.active="live"}}
async function loadSites(){const {data,error}=await sb.from("sites").select("*");if(!error){S.sites=data.map(rowToSite);onSites()}}
async function loadMembers(){const {data}=await sb.from("members").select("*").order("added_at");S.members=data||[]}

/* ---------- sites helpers ---------- */
function allSites(){return S.sites}
function activeChart(){return S.active==="live"?LIVE:S.charts.find(x=>x.id===S.active)}
function isLive(){return S.active==="live"}
function sitePos(s,c){
  if(!c)return null;
  if(c.id==="live")return s.lat!=null&&s.lon!=null?[s.lat,s.lon]:null;
  if(c.geo&&s.lat!=null&&s.lon!=null){const[fx,fy]=llToFrac(c.geo,s.lat,s.lon);return fx>=0&&fx<=1&&fy>=0&&fy<=1?[fx,fy]:null}
  if(s.chartId===c.id&&s.x!=null)return[s.x,s.y];return null}
function chartSites(){const c=activeChart();return allSites().map(s=>({s,p:sitePos(s,c)})).filter(o=>o.p)}
function getSite(id){return allSites().find(s=>s.id===id)}
function onSites(){if(S.condSel&&S.condSel!=="off")debounced("cond",refreshCond);renderPins();if(S.view==="list")renderList();else if(S.view==="site"){if(!getSite(S.sel)){S.view="list";S.sel=null;renderPanel()}else renderSiteBody()}}
function overlay(t,p,btn){const o=$("#overlay");if(!t){o.hidden=true;return}o.hidden=false;o.innerHTML=`<div><h2>${esc(t)}</h2><p>${esc(p)}</p>${btn||""}</div>`}

/* ---------- live sea chart (Leaflet) ---------- */
function initLeaflet(){
  if(S.lmap)return;
  const kv=l=>L.tileLayer(`https://cache.kartverket.no/v1/wmts/1.0.0/${l}/default/webmercator/{z}/{y}/{x}.png`,{maxZoom:18,attribution:'&copy; <a href="https://www.kartverket.no/">Kartverket</a>'});
  const sea=kv("sjokartraster"),topo=kv("topo"),grey=kv("topograatone");
  S.lmap=L.map(lmapEl,{zoomControl:true}).setView([67.28,14.40],10);
  sea.addTo(S.lmap);
  L.control.layers({"Sjøkart":sea,"Topografisk":topo,"Gråtone":grey},null,{position:"topright"}).addTo(S.lmap);
  L.control.scale({imperial:false}).addTo(S.lmap);
  S.fLayer=L.layerGroup().addTo(S.lmap);S.aLayer=L.layerGroup().addTo(S.lmap);S.dLayer=L.layerGroup().addTo(S.lmap);S.lLayer=L.layerGroup().addTo(S.lmap);if(L.Draw)hookDrawEvents();else showErr("tegneverktøyet lastet ikke");
  S.lmap.on("click",e=>liveClick(e.latlng));
  S.lmap.on("mousemove",e=>{if(isLive())$("#coord").textContent=`${e.latlng.lat.toFixed(4)}° N, ${e.latlng.lng.toFixed(4)}° Ø`});
  S.lmap.on("mouseout",()=>{$("#coord").textContent=""});
}
function renderLive(){
  if(!S.lmap)return;S.lLayer.clearLayers();S.fLayer.clearLayers();
  for(const {s} of filtered()){
    const icon=L.divIcon({className:"lp"+(s._priv?" priv":"")+(S.sel===s.id?" sel":""),html:flagSVG(s._priv)+condDot(s)+visBadge(s)+`<span class="lbl">${esc(s.name)}</span>`,iconSize:[30,36],iconAnchor:[4,34]});
    L.marker([s.lat,s.lon],{icon,title:s.name,keyboard:true}).on("click",()=>{if(S.mode==="view"&&!S.drawer&&!S.editingArea)openSite(s.id)}).addTo(S.lLayer)}
  if(S.draft&&S.draft.live)L.marker([S.draft.lat,S.draft.lon],{icon:L.divIcon({className:"lp draft",html:flagSVG(false)+'<span class="lbl">Nytt sted</span>',iconSize:[30,36],iconAnchor:[4,34]}),interactive:false,opacity:.75}).addTo(S.lLayer);
  for(const c of S.charts){if(!c.geo)continue;const k=chartCorners(c),la=k.map(p=>p[0]),lo=k.map(p=>p[1]);
    L.rectangle([[Math.min(...la),Math.min(...lo)],[Math.max(...la),Math.max(...lo)]],{color:"#C0266D",weight:2,dashArray:"6 5",fillOpacity:.05,interactive:S.mode==="view"})
     .bindTooltip(c.name,{permanent:true,direction:"center",className:"ftip"}).on("click",()=>switchChart(c.id)).addTo(S.fLayer)}
}
async function liveClick(ll){
  if(S.mode==="view")return;
  const lat=+ll.lat.toFixed(6),lon=+ll.lng.toFixed(6);
  if(S.mode==="place"){setMode("view");S.draft={live:true,lat,lon,chartId:null};S.sel=null;S.view="edit";renderLive();renderEdit(null)}
  else if(S.mode==="move"){const s=getSite(S.sel);setMode("view");if(!s)return;const {error}=await sb.from("sites").update({lat,lon,updated_at:new Date().toISOString()}).eq("id",s.id);if(error)alert("Kunne ikke flytte: "+errMsg(error));else loadSites()}
}

/* ---------- tabs & image charts ---------- */
function renderTabs(){
  $("#tabs").innerHTML=[LIVE,...S.charts].map(c=>`<button class="tab ${c.id===S.active?"on":""}" data-id="${esc(c.id)}">${esc(c.name)}</button>`).join("");
}
function switchChart(id){cancelDraw();cancelShapeEdit();clearDraft();if(S.view==="area"||S.view==="areaedit"){S.view="list";S.selArea=null}S.active=id;S.draft=null;setMode("view");if(S.view!=="site"){S.view="list";S.sel=null}renderTabs();renderChart();renderPanel()}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(b)switchChart(b.dataset.id)});
function renderChart(){
  const live=isLive();updateDrawUI();lmapEl.hidden=!live;wrap.hidden=live;$("#imgZoom").hidden=live;
  if(live){S.lmap.invalidateSize();renderLive();renderAreas();return}
  const c=activeChart();if(!c)return;
  if(S.imgFor!==c.id){S.imgFor=c.id;img.onload=fit;img.src=imgUrl(c.imagePath);img.alt="Kart: "+c.name}
  else setTimeout(fit,0);
  renderPins();renderFrames();
}
function fit(){
  if(!img.naturalWidth||wrap.hidden)return;
  const w=wrap.clientWidth,h=wrap.clientHeight,r=img.naturalWidth/img.naturalHeight;
  const iw=Math.min(w,h*r);inner.style.width=iw+"px";
  S.maxZoom=Math.max(8,img.naturalWidth/iw*2);
  S.zoom=1;S.px=(w-iw)/2;S.py=(h-iw/r)/2;applyT();
}
function applyT(){inner.style.transform=`translate(${S.px}px,${S.py}px) scale(${S.zoom})`;inner.style.setProperty("--inv",1/S.zoom)}
function zoomAt(f,cx,cy){const nz=Math.min(S.maxZoom,Math.max(.5,S.zoom*f));S.px=cx-(cx-S.px)*(nz/S.zoom);S.py=cy-(cy-S.py)*(nz/S.zoom);S.zoom=nz;applyT()}
function centerOn(fx,fy,minZoom){const w=wrap.clientWidth,h=wrap.clientHeight,iw=inner.offsetWidth,ih=inner.offsetHeight;if(minZoom&&S.zoom<minZoom)S.zoom=Math.min(minZoom,S.maxZoom);S.px=w/2-fx*iw*S.zoom;S.py=h/2-fy*ih*S.zoom;applyT()}
$("#zin").onclick=()=>zoomAt(1.5,wrap.clientWidth/2,wrap.clientHeight/2);
$("#zout").onclick=()=>zoomAt(1/1.5,wrap.clientWidth/2,wrap.clientHeight/2);
$("#zfit").onclick=fit;
wrap.addEventListener("wheel",e=>{if(!S.imgFor)return;e.preventDefault();const r=wrap.getBoundingClientRect();zoomAt(e.deltaY<0?1.2:1/1.2,e.clientX-r.left,e.clientY-r.top)},{passive:false});
let drag=null;const touches=new Map();let pinch=null;
wrap.addEventListener("pointerdown",e=>{
  if(e.target.closest(".pin")||e.target.closest(".overlay>div"))return;
  touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(touches.size===2){const [a,b]=[...touches.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)};drag=null;return}
  drag={x:e.clientX,y:e.clientY,px:S.px,py:S.py,moved:false,frame:e.target.closest(".frame")?.dataset.chart};wrap.setPointerCapture(e.pointerId);
});
wrap.addEventListener("pointermove",e=>{
  showCoord(e);
  if(touches.has(e.pointerId))touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&touches.size===2){const [a,b]=[...touches.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const r=wrap.getBoundingClientRect();zoomAt(d/pinch.d,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);pinch.d=d;return}
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moved&&Math.hypot(dx,dy)>4){drag.moved=true;wrap.classList.add("dragging")}
  if(drag.moved){S.px=drag.px+dx;S.py=drag.py+dy;applyT()}
});
function endPtr(e){touches.delete(e.pointerId);if(touches.size<2)pinch=null;
  if(drag&&!drag.moved&&e.type==="pointerup"){if(drag.frame&&S.mode==="view")switchChart(drag.frame);else mapClick(e)}
  drag=null;wrap.classList.remove("dragging")}
wrap.addEventListener("pointerup",endPtr);wrap.addEventListener("pointercancel",endPtr);
wrap.addEventListener("pointerleave",()=>{if(!isLive())$("#coord").textContent=""});
window.addEventListener("resize",()=>{if(!isLive()&&S.imgFor)fit()});
function evFrac(e){const r=img.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
function showCoord(e){const c=activeChart();const el=$("#coord");if(!c||!c.geo||!img.naturalWidth){el.textContent="";return}
  const[fx,fy]=evFrac(e);if(fx<0||fx>1||fy<0||fy>1){el.textContent="";return}const[la,lo]=fracToLL(c.geo,fx,fy);el.textContent=`${la.toFixed(4)}° N, ${lo.toFixed(4)}° Ø`}

function setMode(m){S.mode=m;wrap.classList.toggle("placing",m!=="view");lmapEl.style.cursor=m!=="view"?"crosshair":"";
  $("#hint").textContent=m==="place"?"Klikk på kartet der dykkestedet er. Esc avbryter.":m==="move"?"Klikk på den nye plasseringen. Esc avbryter.":"";
  $("#placeBtn").textContent=m==="place"?"Avbryt":"Nytt dykkested";if(isLive())renderLive()}
$("#placeBtn").onclick=()=>{cancelDraw();cancelShapeEdit();setMode(S.mode==="place"?"view":"place")};
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(S.mode!=="view")setMode("view");if(S.drawer||S.drawMenu)cancelDraw();if(S.editingArea){cancelShapeEdit();if(S.view==="area")renderAreaBody()}});
async function mapClick(e){
  if(S.mode==="view"||!img.naturalWidth)return;
  const[x,y]=evFrac(e);if(x<0||x>1||y<0||y>1)return;
  const c=activeChart();const ll=c.geo?fracToLL(c.geo,x,y):null;
  if(S.mode==="place"){setMode("view");S.draft={chartId:S.active,x,y,lat:ll?+ll[0].toFixed(6):null,lon:ll?+ll[1].toFixed(6):null};S.sel=null;S.view="edit";renderPins();renderEdit(null)}
  else if(S.mode==="move"){const s=getSite(S.sel);setMode("view");if(!s)return;
    const upd=ll?{lat:+ll[0].toFixed(6),lon:+ll[1].toFixed(6)}:{};if(!c.geo||s.chartId===c.id||s.x==null){upd.chart_id=c.id;upd.x=x;upd.y=y}
    const {error}=await sb.from("sites").update(upd).eq("id",s.id);if(error)alert("Kunne ikke flytte: "+errMsg(error));else loadSites()}
}

/* ---------- pins & frames on image charts ---------- */
function filtered(){const q=S.q.trim().toLowerCase();
  return chartSites().filter(({s})=>(!S.sp||spSiteSet().has(s.id))&&(S.acc==="alle"||s.access===S.acc||s.access==="begge")&&(!q||[s.name,s.species,s.bottom,s.notes].join(" ").toLowerCase().includes(q)))}
function renderPins(){
  if(isLive()){renderLive();return}
  let h=filtered().map(({s,p})=>`<button class="pin ${s._priv?"priv":""} ${S.sel===s.id?"sel":""}" data-id="${esc(s.id)}" style="left:${p[0]*100}%;top:${p[1]*100}%" aria-label="${esc(s.name)}">${flagSVG(s._priv)}${condDot(s)}${visBadge(s)}<span class="lbl">${esc(s.name)}</span></button>`).join("");
  if(S.draft&&!S.draft.live&&S.draft.chartId===S.active)h+=`<span class="pin draft" style="left:${S.draft.x*100}%;top:${S.draft.y*100}%">${flagSVG(false)}<span class="lbl">Nytt sted</span></span>`;
  pinsEl.innerHTML=h;
}
pinsEl.addEventListener("click",e=>{const p=e.target.closest(".pin[data-id]");if(!p||S.mode!=="view")return;openSite(p.dataset.id)});
function renderFrames(){
  const c=activeChart();let h="";
  if(c&&c.geo){for(const o of S.charts){if(o.id===c.id||!o.geo)continue;
    const fr=chartCorners(o).map(([la,lo])=>llToFrac(c.geo,la,lo));const xs=fr.map(f=>f[0]),ys=fr.map(f=>f[1]);
    const x0=Math.max(0,Math.min(...xs)),x1=Math.min(1,Math.max(...xs)),y0=Math.max(0,Math.min(...ys)),y1=Math.min(1,Math.max(...ys));
    if(x1<=x0||y1<=y0)continue;if((Math.max(...xs)-Math.min(...xs))*(Math.max(...ys)-Math.min(...ys))>0.6)continue;
    h+=`<div class="frame" data-chart="${esc(o.id)}" title="Åpne ${esc(o.name)}" style="left:${x0*100}%;top:${y0*100}%;width:${(x1-x0)*100}%;height:${(y1-y0)*100}%"><span>${esc(o.name)}</span></div>`}}
  framesEl.innerHTML=h;
}

function renderStats(){
  const el=$("#stats");if(!el)return;const L=S.logs;const vis=L.map(l=>l.vis).filter(v=>v!=null);
  if(!L.length){el.innerHTML="";return}
  const avg=vis.length?vis.reduce((a,b)=>a+b,0)/vis.length:null,best=vis.length?Math.max(...vis):null;
  el.innerHTML=`<div class="stats"><div><b>${L.length}</b><span>dykk</span></div><div><b>${avg!=null?fnum(avg,1):"–"}</b><span>snitt sikt, m</span></div><div><b>${best!=null?fnum(best):"–"}</b><span>beste sikt, m</span></div><div><b>${esc(fdate(L[0].date,true))}</b><span>sist dykket</span></div></div>${spark(L)}`;
}
function spark(L){
  const pts=[...L].filter(l=>l.vis!=null).reverse().slice(-24);if(pts.length<2)return"";
  const W=360,H=64,max=Math.max(...pts.map(p=>p.vis),5),bw=W/pts.length;
  return `<svg class="spark" viewBox="0 0 ${W} ${H+14}" width="100%" role="img" aria-label="Sikt per dykk">${pts.map((p,i)=>{const h=Math.max(2,p.vis/max*H);return `<rect x="${i*bw+2}" y="${H-h}" width="${Math.max(2,bw-4)}" height="${h}" rx="2" fill="var(--alpha)"><title>${esc(fdate(p.date))}: ${fnum(p.vis)} m</title></rect>`}).join("")}
  <text x="0" y="${H+11}">${esc(fdate(pts[0].date,true))}</text><text x="${W}" y="${H+11}" text-anchor="end">${esc(fdate(pts[pts.length-1].date,true))}</text><text x="${W}" y="9" text-anchor="end">sikt, maks ${fnum(max)} m</text></svg>`;
}

/* ---------- wind rose ---------- */
function rose(sel,editable,size){
  const c=size/2,R=c-13,r0=9;const p=(r,a)=>{const t=a*Math.PI/180;return[(c+r*Math.sin(t)).toFixed(2),(c-r*Math.cos(t)).toFixed(2)]};
  let h=`<svg class="rose ${editable?"edit":""}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="${editable?"group":"img"}" aria-label="Vindretninger plassen tåler">`;
  h+=`<circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="var(--line)"/>`;
  DIRS.forEach((d,i)=>{const a=i*45,on=sel.includes(d);const [x1,y1]=p(r0,a-20),[x2,y2]=p(R,a-20),[x3,y3]=p(R,a+20),[x4,y4]=p(r0,a+20);
    h+=`<path data-d="${d}" d="M${x1} ${y1}L${x2} ${y2}A${R} ${R} 0 0 1 ${x3} ${y3}L${x4} ${y4}A${r0} ${r0} 0 0 0 ${x1} ${y1}Z" fill="${on?"var(--kelp)":"var(--panel)"}" stroke="var(--line)"${editable?` tabindex="0" role="checkbox" aria-checked="${on}" aria-label="${d}"`:""}><title>${d}</title></path>`;
    const [tx,ty]=p(R+7,a);h+=`<text x="${tx}" y="${ty}">${d}</text>`});
  return h+"</svg>";
}

async function computeGeo(w,h){
  const wf=$("#cWorld").files[0];
  if(wf){const n=(await wf.text()).split(/\s+/).map(num).filter(v=>v!=null);if(n.length<6)throw{message:"World-filen har ikke seks tall."};
    const[Ax,,, Ey,C,F]=n;if(!(Ax>0)||!(Ey<0))throw{message:"World-filen ser rotert eller ugyldig ut."};
    let proj;if(Math.abs(C)<=180&&Math.abs(F)<=90)proj="4326";else if(F>9e6)proj="3857";else if(F>6e6)proj="25833";
    else throw{message:"Ukjent koordinatsystem. Eksporter fra QGIS i UTM 33 (EPSG:25833) eller Web Mercator (EPSG:3857)."};
    const minX=C-Ax/2,maxY=F-Ey/2;return{proj,minX,maxX:minX+Ax*w,maxY,minY:maxY+Ey*h}}
  const v=["cTLlat","cTLlon","cBRlat","cBRlon"].map(id=>num($("#"+id).value));
  if(v.every(x=>x==null))return undefined;
  if(v.some(x=>x==null))throw{message:"Fyll inn alle fire hjørnekoordinatene."};
  if(!(v[0]>v[2]&&v[3]>v[1]))throw{message:"Øvre venstre må ligge nord og vest for nedre høyre."};
  const proj=$("#cProj").value,[x1,y1]=fwd(proj,v[0],v[1]),[x2,y2]=fwd(proj,v[2],v[3]);
  return{proj,minX:x1,maxX:x2,maxY:y1,minY:y2};
}

const AREA_TYPES={
  quality:{name:"Kvalitet",vals:{bra:["Bra","#2E9E44"],ok:["OK","#E0B020"],darlig:["Dårlig","#D0452F"]}},
  depth:{name:"Dybde",vals:{d0:["0–10 m","#9FD3F5"],d10:["10–20 m","#4FA3E0"],d20:["20–30 m","#1F64B8"],d30:["30+ m","#0B2F6B"]}},

  hazard:{name:"Fare",vals:{strom:["Sterk strøm","#D11A2A"],bat:["Båttrafikk","#E8551A"],garn:["Garn/teiner","#B0124F"],annet:["Annen fare","#C0392B"]}},
  rules:{name:"Regler og vern",vals:{vern:["Verneområde","#7B3FB5"],fiskeforbud:["Fiskeforbud","#9C27B0"],forbud:["Ferdselsforbud","#4A148C"]}}
};
const AREA_ORDER=["depth","habitat","quality","rules","hazard"];
S.areas=[];S.selArea=null;S.areaLayers={};S.drawer=null;S.drawMenu=false;S.drawKind=null;S.draftArea=null;S.draftLayer=null;S.editingArea=null;S.areasErr=null;
S.lastKind="quality";S.lastValue="bra";
try{S.hidden=new Set(JSON.parse(localStorage.getItem("dk-hidden")||"[]"))}catch(e){S.hidden=new Set()}
function saveHidden(){try{localStorage.setItem("dk-hidden",JSON.stringify([...S.hidden]))}catch(e){}}
function areaColor(k,v){return AREA_TYPES[k]?.vals[v]?.[1]||"#888888"}
function areaLabel(a){const t=AREA_TYPES[a.kind];return t?(t.vals[a.value]?.[0]||a.value):a.kind}
function rowToArea(r){return{id:r.id,name:r.name||"",kind:r.kind,value:r.value,notes:r.notes||"",geom:r.geom,siteId:r.site_id,_priv:r.private,createdBy:r.created_by,authorName:r.author_name||""}}
function areaErr(e){const m=errMsg(e);return (e&&(e.code==="42P01"||e.code==="PGRST205"))||/areas/.test(m)&&/(does not exist|could not find)/i.test(m)?"Tabellen for områder finnes ikke ennå. Kjør areas.sql i Supabase.":m}
async function loadAreas(){
  const {data,error}=await sb.from("areas").select("*");
  if(error){S.areasErr=areaErr(error);if(S.view==="list")renderList();return}
  S.areasErr=null;S.areas=data.map(rowToArea);renderAreas();
  if(S.view==="list")renderList();
  else if(S.view==="area"){if(!S.areas.find(a=>a.id===S.selArea)){S.view="list";S.selArea=null;renderPanel()}else if(!S.editingArea)renderAreaBody()}
}
function areaStyle(kind,value,gtype,sel){
  const c=areaColor(kind,value),line=/LineString/.test(gtype||"");
  const st={color:c,weight:line?5:2,opacity:.95,fillColor:c,fillOpacity:line?0:(kind==="depth"?.35:.25)};
  if(kind==="hazard")st.dashArray="8 5";if(kind==="rules")st.dashArray="2 6";
  if(sel){st.weight+=2;st.color="#C0266D";st.fillOpacity=line?0:Math.min(.55,st.fillOpacity+.15)}
  return st;
}
function areaVisible(a){if(S.hidden.has(a.kind))return false;const q=S.q.trim().toLowerCase();
  return !q||[a.name,a.notes,areaLabel(a),AREA_TYPES[a.kind]?.name].join(" ").toLowerCase().includes(q)}
function renderAreas(){
  if(!S.lmap||S.editingArea)return;S.aLayer.clearLayers();S.areaLayers={};
  const list=S.areas.filter(areaVisible).sort((a,b)=>AREA_ORDER.indexOf(a.kind)-AREA_ORDER.indexOf(b.kind));
  for(const a of list){let gl;
    try{gl=L.geoJSON({type:"Feature",geometry:a.geom,properties:{}},{style:()=>areaStyle(a.kind,a.value,a.geom.type,S.selArea===a.id)})}catch(e){continue}
    gl.eachLayer(l=>{
      l.on("click",ev=>{if(S.mode!=="view"||S.drawer||S.editingArea)return;L.DomEvent.stopPropagation(ev);openArea(a.id)});
      l.bindTooltip(esc((a.name?a.name+" – ":"")+areaLabel(a)),{sticky:true});S.areaLayers[a.id]=l});
    gl.addTo(S.aLayer)}
}
function geomSize(g){
  const ll=c=>c.map(([lo,la])=>L.latLng(la,lo));
  const polyArea=rings=>L.GeometryUtil&&L.GeometryUtil.geodesicArea?L.GeometryUtil.geodesicArea(ll(rings[0])):null;
  const lineLen=c=>{const p=ll(c);let d=0;for(let i=1;i<p.length;i++)d+=p[i-1].distanceTo(p[i]);return d};
  const fa=m=>m<100000?`${fnum(Math.round(m))} m²`:`${fnum(m/1e6,2)} km²`,fl=m=>m<2000?`${fnum(Math.round(m))} m`:`${fnum(m/1000,2)} km`;
  try{
    if(g.type==="Polygon"){const a=polyArea(g.coordinates);return a!=null?["Areal",fa(a)]:null}
    if(g.type==="MultiPolygon"){let s=0;for(const p of g.coordinates){const a=polyArea(p);if(a==null)return null;s+=a}return["Areal",fa(s)]}
    if(g.type==="LineString")return["Lengde",fl(lineLen(g.coordinates))];
    if(g.type==="MultiLineString")return["Lengde",fl(g.coordinates.reduce((s,c)=>s+lineLen(c),0))];
  }catch(e){}return null;
}

function download(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
function downloadGeoJSON(){
  const feats=[];
  for(const s of S.sites)if(s.lat!=null&&s.lon!=null)feats.push({type:"Feature",geometry:{type:"Point",coordinates:[s.lon,s.lat]},
    properties:{layer:"dykkested",name:s.name,access:ACCESS[s.access]||s.access,max_depth:s.maxDepth,bottom:s.bottom,tide:s.tide,season:s.season,wind:(s.wind||[]).join(","),hazards:s.hazards,rules:s.rules,species:s.species,notes:s.notes,rating:s.rating,log_count:s.logCount,last_dive:s.lastDive,private:s._priv}});
  for(const a of S.areas)feats.push({type:"Feature",geometry:a.geom,properties:{layer:"omrade",name:a.name,kind:a.kind,kind_name:AREA_TYPES[a.kind]?.name,value:a.value,value_name:areaLabel(a),notes:a.notes,site:a.siteId?(getSite(a.siteId)?.name||""):"",private:a._priv}});
  download("dykkekart.geojson",JSON.stringify({type:"FeatureCollection",features:feats},null,1),"application/geo+json");
}
async function importGeoJSON(file,fallback){
  const msg=$("#mGeoMsg");const say=t=>{msg.textContent=t};
  try{
    const d=JSON.parse(await file.text());
    const feats=d.type==="FeatureCollection"?d.features:d.type==="Feature"?[d]:d.type?[{type:"Feature",geometry:d,properties:{}}]:[];
    const [fk,fv]=fallback.split(":");const rows=[];let skipped=0;
    const firstCoord=g=>{let c=g.coordinates;while(Array.isArray(c)&&Array.isArray(c[0]))c=c[0];return c};
    for(const f of feats){const g=f&&f.geometry;
      if(!g||!/^(Multi)?(Polygon|LineString)$/.test(g.type)){skipped++;continue}
      const c=firstCoord(g);if(!c||Math.abs(c[0])>180||Math.abs(c[1])>90)throw{message:"Koordinatene ser ikke ut som grader. Eksporter fra QGIS med koordinatsystem EPSG:4326 (WGS 84)."};
      const p=f.properties||{};const k=AREA_TYPES[p.kind]&&AREA_TYPES[p.kind].vals[p.value]?p.kind:fk,v=k===p.kind?p.value:fv;
      rows.push({name:String(p.name||p.navn||p.Name||"").slice(0,200),kind:k,value:v,notes:String(p.notes||p.notater||""),geom:g,private:false,created_by:S.user.id,author_name:S.me.name})}
    if(!rows.length){say(`Fant ingen polygoner eller linjer${skipped?` (${skipped} andre objekter hoppet over)`:""}.`);return}
    say(`Legger inn ${rows.length} områder…`);
    for(let i=0;i<rows.length;i+=200){const {error}=await sb.from("areas").insert(rows.slice(i,i+200));if(error)throw error}
    say(`Ferdig: ${rows.length} ${rows.length===1?"område":"områder"} importert${skipped?`, ${skipped} punkter eller andre objekter hoppet over`:""}.`);
    await loadAreas();
  }catch(err){say("Import stoppet: "+areaErr(err))}
}

/* ---------- conditions: wind (MET) + tide (Kartverket) ---------- */
S.cond={};S.condSel="off";S.condTime=null;
const FC={},FCP={},TD={},TDP={};
const LV=[["Dykkbart","var(--kelp)"],["Tvilsomt","#E0B020"],["For mye vind","#D0452F"]];
function gk(lat,lon){return lat.toFixed(2)+","+lon.toFixed(2)}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function hm(t){return new Date(t).toLocaleTimeString("nb-NO",{hour:"2-digit",minute:"2-digit"})}
function dayLbl(t){const d=new Date(t),n=new Date();const a=new Date(d.getFullYear(),d.getMonth(),d.getDate()),b=new Date(n.getFullYear(),n.getMonth(),n.getDate());const diff=Math.round((a-b)/864e5);
  return diff===0?"i dag":diff===1?"i morgen":d.toLocaleDateString("nb-NO",{weekday:"long"})}

async function getForecast(lat,lon){
  const k=gk(lat,lon);let c=FC[k]||lsGet("fc:"+k);
  if(c&&c.exp>Date.now())return FC[k]=c;
  if(FCP[k])return FCP[k];
  FCP[k]=(async()=>{
    const r=await fetch(`https://api.met.no/weatherapi/locationforecast/2.0/complete?lat=${lat.toFixed(2)}&lon=${lon.toFixed(2)}`);
    if(!r.ok)throw new Error("Meteorologisk institutt svarte med feil "+r.status);
    const j=await r.json();const ex=Date.parse(r.headers.get("Expires")||"")||0;
    const exp=Math.min(Date.now()+2*3600e3,Math.max(Date.now()+20*60e3,ex));
    const series=j.properties.timeseries.slice(0,90).map(t=>{const d=t.data.instant.details;
      return[Date.parse(t.time),d.wind_from_direction,d.wind_speed,d.wind_speed_of_gust??null,d.air_temperature,(t.data.next_1_hours||t.data.next_6_hours)?.summary?.symbol_code||""]});
    const c={exp,series};FC[k]=c;lsSet("fc:"+k,c);return c;
  })().finally(()=>{delete FCP[k]});
  return FCP[k];
}
function windAt(fc,t){if(!fc)return null;let best=null,bd=Infinity;for(const e of fc.series){const d=Math.abs(e[0]-t);if(d<bd){bd=d;best=e}}return bd<=3.5*3600e3?best:null}
function windStatus(s,w){
  if(!w)return null;const [,dir,sp,gu]=w;const g=gu??sp*1.5;
  const sec=DIRS[Math.round(dir/45)%8],has=(s.wind||[]).length>0,lee=has&&s.wind.includes(sec);
  let lvl;
  if(sp<4&&g<8)lvl=0;
  else if(lee)lvl=sp<10&&g<15?0:sp<14?1:2;
  else lvl=sp<7?1:2;
  if(sp>=15||g>=20)lvl=2;
  return{lvl,sec,sp,g,lee,has,dir};
}

async function getTide(lat,lon){
  const k=lat.toFixed(3)+","+lon.toFixed(3);let c=TD[k]||lsGet("td:"+k);
  if(c&&c.exp>Date.now()&&c.until>Date.now()+30*3600e3)return TD[k]=c;
  if(TDP[k])return TDP[k];
  TDP[k]=(async()=>{
    const from=new Date(Date.now()-6*3600e3),to=new Date(Date.now()+54*3600e3),f=d=>d.toISOString().slice(0,16);
    const url=`https://vannstand.kartverket.no/tideapi.php?tide_request=locationdata&lat=${lat.toFixed(3)}&lon=${lon.toFixed(3)}&datatype=pre&refcode=cd&fromtime=${f(from)}&totime=${f(to)}&interval=10&tzone=0&lang=nb`;
    let r;try{r=await fetch(url)}catch(e){throw new Error("Kartverket kunne ikke nås fra nettleseren")}
    if(!r.ok)throw new Error("Kartverket svarte med feil "+r.status);
    const x=new DOMParser().parseFromString(await r.text(),"text/xml");
    const datas=[...x.getElementsByTagName("data")];
    const dataEl=datas.find(d=>/pre/i.test(d.getAttribute("type")||""))||datas[0]||x;
    const pts=[...dataEl.getElementsByTagName("waterlevel")].map(e=>[Date.parse(e.getAttribute("time")),parseFloat(e.getAttribute("value"))]).filter(p=>isFinite(p[0])&&isFinite(p[1])).sort((a,b)=>a[0]-b[0]);
    if(pts.length<5){const nd=x.getElementsByTagName("nodata")[0];throw new Error(nd?(nd.getAttribute("info")||nd.textContent||"Ingen tidevannsdata her"):"Ingen tidevannsdata for denne posisjonen")}
    const ext=[];
    for(let i=1;i<pts.length-1;i++){const [a,b,n]=[pts[i-1][1],pts[i][1],pts[i+1][1]];
      if(b>a&&b>=n)ext.push([pts[i][0],b,"high"]);else if(b<a&&b<=n)ext.push([pts[i][0],b,"low"])}
    const loc=x.getElementsByTagName("location")[0];
    const c={exp:Date.now()+6*3600e3,until:to.getTime(),pts:pts.filter((p,i)=>i%2===0),ext,station:loc?(loc.getAttribute("name")||""):""};
    TD[k]=c;lsSet("td:"+k,c);return c;
  })().finally(()=>{delete TDP[k]});
  return TDP[k];
}
function tideWindows(s,td){
  const mode=s.tideMode||"none";if(mode==="none"||!td)return[];
  const off=(s.tideOffset||0)*60e3,half=(s.tideWidth||60)*30e3;
  return td.ext.filter(e=>mode==="both"||e[2]===mode).map(e=>[e[0]+off-half,e[0]+off+half,e[2]]);
}

/* map dots */
function condTarget(v){const n=new Date();if(v==="now")return Date.now();if(/^\+\d+$/.test(v))return Date.now()+(+v.slice(1))*3600e3;
  const m=v.match(/^d(\d)h(\d+)$/);if(m){const d=new Date(n.getFullYear(),n.getMonth(),n.getDate()+(+m[1]),+m[2]);return d.getTime()}return null}
function condDot(s){if(S.condSel==="off"||s.lat==null)return"";const st=S.cond[s.id];if(!st)return"";
  return `<span class="cdot" style="background:${LV[st.lvl][1]}" title="${esc(LV[st.lvl][0])}"></span>`}
async function refreshCond(){
  S.condTime=condTarget(S.condSel);
  const note=$("#condNote");
  if(S.condSel==="off"){S.cond={};renderPins();if(S.view==="list")renderList();return}
  const list=S.sites.filter(s=>s.lat!=null&&s.lon!=null);let failed=0;
  await Promise.all(list.map(async s=>{try{const fc=await getForecast(s.lat,s.lon);const st=windStatus(s,windAt(fc,S.condTime));if(st)S.cond[s.id]=st;else delete S.cond[s.id]}catch(e){failed++;delete S.cond[s.id]}}));
  S.condFailed=failed;renderPins();if(S.view==="list")renderList();
}
function condNoteHTML(){
  if(S.condSel==="off")return"";
  const t=S.condTime?`${dayLbl(S.condTime)} kl ${hm(S.condTime)}`:"";
  return `Vindforhold ${esc(t)}: <i class="sw" style="background:var(--kelp)"></i> dykkbart <i class="sw" style="background:#E0B020"></i> tvilsomt <i class="sw" style="background:#D0452F"></i> for mye vind.${S.condFailed?` Varselet kunne ikke hentes for ${S.condFailed} sted(er).`:""}`;
}
function initCond(){
  const sel=$("#condSel");const saved=lsGet("dk-cond");if(saved&&[...sel.options].some(o=>o.value===saved))sel.value=saved;
  S.condSel=sel.value;sel.onchange=()=>{S.condSel=sel.value;lsSet("dk-cond",S.condSel);refreshCond()};
  if(S.condSel!=="off")refreshCond();
  setInterval(()=>{if(S.condSel!=="off")refreshCond()},30*60e3);
}

/* site panel box */
function arrowSVG(dir,size=34){return `<svg width="${size}" height="${size}" viewBox="-10 -10 20 20" aria-hidden="true"><circle r="9.3" fill="none" stroke="var(--line)"/><g transform="rotate(${dir+180})"><path d="M0 -7 L4 3 L0 1 L-4 3 Z" fill="var(--ink)"/></g></svg>`}
async function renderCond(s){
  const el=$("#condBox");if(!el)return;
  if(s.lat==null||s.lon==null){el.innerHTML=`<div class="cond"><p class="small" style="margin:0">Legg inn posisjon (eller plasser stedet på sjøkartet) for å få vær og tidevann.</p></div>`;return}
  el.innerHTML=`<div class="cond"><p class="small" style="margin:0">Henter vær og tidevann…</p></div>`;
  const [fr,tr]=await Promise.allSettled([getForecast(s.lat,s.lon),getTide(s.lat,s.lon)]);
  if(S.sel!==s.id||!$("#condBox"))return;
  const now=Date.now();let h="";
  if(fr.status==="fulfilled"){
    const fc=fr.value,w=windAt(fc,now),st=windStatus(s,w);
    if(st){
      const why=!st.has?"Vindrose mangler, vurdert bare etter styrke.":st.lee?`Plassen tåler vind fra ${st.sec}.`:`Plassen er ikke registrert som skjermet for ${st.sec}.`;
      h+=`<div class="cnow">${arrowSVG(st.dir)}<div><strong style="color:${LV[st.lvl][1]}">${LV[st.lvl][0]} nå</strong><span>${fnum(st.sp,0)} m/s${w[3]!=null?` (kast ${fnum(st.g,0)})`:""} fra ${st.sec}${w[4]!=null?`, ${fnum(w[4],0)} °C`:""}</span><span class="small" style="display:block;margin:0">${esc(why)}</span></div></div>`;
      h+=windStrip(s,fc,now);
    }
  }else h+=`<p class="small err" style="margin:0 0 8px">Vær: ${esc(fr.reason?.message||"kunne ikke hentes")}</p>`;
  if(tr.status==="fulfilled"){
    const td=tr.value,next=td.ext.filter(e=>e[0]>now).slice(0,4);
    h+=`<div class="ctide"><strong>Tidevann</strong> ${next.map(e=>`<span>${e[2]==="high"?"Flo":"Fjære"} ${esc(dayLbl(e[0])==="i dag"?"":dayLbl(e[0])+" ")}${hm(e[0])} <small>${Math.round(e[1])} cm</small></span>`).join("")}</div>`;
    const wins=tideWindows(s,td),nw=wins.find(x=>x[1]>now);
    let winTxt="";
    if(nw){const mid=(nw[0]+nw[1])/2,fc=fr.status==="fulfilled"?fr.value:null,ws=fc&&windStatus(s,windAt(fc,mid));
      winTxt=`<p class="cwin"><strong>${nw[0]<=now?`Dykkevindu nå, til ${hm(nw[1])}`:`Neste dykkevindu: ${dayLbl(nw[0])} ${hm(nw[0])}–${hm(nw[1])}`}</strong>${ws?` <span style="color:${LV[ws.lvl][1]};font-weight:600">· ${LV[ws.lvl][0].toLowerCase()}</span>`:""}</p>`}
    else if((s.tideMode||"none")==="none")winTxt=`<p class="small" style="margin:4px 0 0">Sett dykkevindu under Rediger for å få «neste gode tidspunkt».</p>`;
    h+=tideCurve(td,wins,now)+winTxt;
  }else h+=`<p class="small" style="margin:6px 0 0">Tidevann: ${esc(tr.reason?.message||"kunne ikke hentes")}. <a href="https://kartverket.no/til-sjos/se-havniva" target="_blank" rel="noopener">Se havnivå hos Kartverket</a></p>`;
  h+=`<p class="small" style="margin:8px 0 0">Vær fra MET Norway, tidevann fra Kartverket (CC BY 4.0). Varsel, ikke garanti: sjekk forholdene selv.</p>`;
  el.innerHTML=`<div class="cond">${h}</div>`;
}
function windStrip(s,fc,now){
  const pts=fc.series.filter(e=>e[0]>=now-1800e3&&e[0]<=now+48*3600e3);if(pts.length<3)return"";
  const W=360,H=34,t0=pts[0][0],t1=pts[pts.length-1][0],x=t=>(t-t0)/(t1-t0)*W,maxS=Math.max(12,...pts.map(p=>p[3]??p[2]));
  let bars="",lbl="";
  pts.forEach((p,i)=>{const st=windStatus(s,p),x0=x(p[0]),x1=i<pts.length-1?x(pts[i+1][0]):W,h=Math.max(3,p[2]/maxS*H);
    bars+=`<rect x="${x0.toFixed(1)}" y="${(H-h).toFixed(1)}" width="${Math.max(1,x1-x0-1).toFixed(1)}" height="${h.toFixed(1)}" fill="${LV[st.lvl][1]}"><title>${esc(dayLbl(p[0]))} ${hm(p[0])}: ${fnum(p[2],0)} m/s fra ${st.sec}</title></rect>`;
    const d=new Date(p[0]);if(d.getMinutes()===0&&d.getHours()%6===0)lbl+=`<line x1="${x0}" x2="${x0}" y1="0" y2="${H}" stroke="var(--line)"/><text x="${x0+2}" y="${H+11}">${d.getHours()===0?esc(d.toLocaleDateString("nb-NO",{weekday:"short"})):String(d.getHours()).padStart(2,"0")}</text>`});
  return `<svg class="spark" viewBox="0 0 ${W} ${H+14}" width="100%" role="img" aria-label="Vind de neste 48 timene">${lbl}${bars}</svg>`;
}
function tideCurve(td,wins,now){
  const pts=td.pts.filter(p=>p[0]>=now-2*3600e3&&p[0]<=now+36*3600e3);if(pts.length<4)return"";
  const W=360,H=48,t0=pts[0][0],t1=pts[pts.length-1][0],vs=pts.map(p=>p[1]),lo=Math.min(...vs),hi=Math.max(...vs);
  const x=t=>(t-t0)/(t1-t0)*W,y=v=>H-4-(v-lo)/((hi-lo)||1)*(H-10);
  const path=pts.map((p,i)=>(i?"L":"M")+x(p[0]).toFixed(1)+" "+y(p[1]).toFixed(1)).join("");
  const win=wins.filter(w=>w[1]>t0&&w[0]<t1).map(w=>`<rect x="${Math.max(0,x(w[0])).toFixed(1)}" y="0" width="${(Math.min(W,x(w[1]))-Math.max(0,x(w[0]))).toFixed(1)}" height="${H}" fill="var(--kelp)" opacity=".18"/>`).join("");
  const ex=td.ext.filter(e=>e[0]>=t0&&e[0]<=t1).map(e=>`<circle cx="${x(e[0]).toFixed(1)}" cy="${y(e[1]).toFixed(1)}" r="2.5" fill="var(--alpha)"/><text x="${x(e[0]).toFixed(1)}" y="${e[2]==="high"?y(e[1])-5:Math.min(H+11,y(e[1])+12)}" text-anchor="middle">${hm(e[0])}</text>`).join("");
  return `<svg class="spark" viewBox="0 -12 ${W} ${H+24}" width="100%" role="img" aria-label="Tidevann de neste 36 timene">${win}<path d="${path}" fill="none" stroke="var(--alpha)" stroke-width="2"/><line x1="${x(now)}" x2="${x(now)}" y1="-10" y2="${H}" stroke="var(--magenta)" stroke-dasharray="3 3"/>${ex}</svg>`;
}
async function tideSafe(fn,row){
  let res=await fn(row);
  if(res.error&&/tide_/.test(errMsg(res.error))){const r={...row};delete r.tide_mode;delete r.tide_offset;delete r.tide_width;res=await fn(r);
    if(!res.error)alert("Stedet er lagret, men dykkevinduet ble ikke lagret. Kjør tide.sql i Supabase først.")}
  return res;
}

/* ---------- catch / species log + visibility reports ---------- */
S.catches=[];S.reports=[];S.sp="";S.catchErr=null;S.visErr=null;
const SPECIES=["Torsk","Sei","Lyr","Hyse","Lange","Brosme","Steinbit","Breiflabb","Kveite","Rødspette","Skrubbe","Sandflyndre","Piggvar","Lomre","Uer","Berggylt","Grønngylt","Bergnebb","Rødnebb/blåstål","Makrell","Ulke","Rognkjeks","Tangsprell","Kamskjell","Harpeskjell","Blåskjell","O-skjell","Kongekrabbe","Taskekrabbe","Hummer","Sjøkreps","Kråkebolle","Sjøpølse","Sjøstjerne","Kolmule","Pigghå","Hvitting","Laks","Sjøørret","Sel","Oter"];
function tableErr(e,file){const m=errMsg(e);return (e&&(e.code==="42P01"||e.code==="PGRST205"))||/(does not exist|could not find the table)/i.test(m)?`Tabellen finnes ikke ennå. Kjør ${file} i Supabase.`:m}
function normSp(x){x=String(x||"").trim().replace(/\s+/g," ");return x?x[0].toLocaleUpperCase("nb")+x.slice(1):""}
function ago(t){const d=(Date.now()-Date.parse(t))/60e3;if(d<2)return"nå nettopp";if(d<60)return`${Math.round(d)} min siden`;if(d<24*60)return`${Math.round(d/60)} t siden`;if(d<48*60)return"i går";return new Date(t).toLocaleDateString("nb-NO",{day:"numeric",month:"short"})}
async function loadCatches(){const {data,error}=await sb.from("catches").select("*");if(error){S.catchErr=tableErr(error,"catch.sql");return}S.catchErr=null;S.catches=data;afterCatchData()}
async function loadReports(){const since=new Date(Date.now()-14*864e5).toISOString();const {data,error}=await sb.from("vis_reports").select("*").gte("created_at",since);
  if(error){S.visErr=tableErr(error,"catch.sql");return}S.visErr=null;S.reports=data.sort((a,b)=>b.created_at.localeCompare(a.created_at));afterVisData()}
function afterCatchData(){if(S.view==="list")renderList();else if(S.view==="site"){renderLogs();renderSpecies()}if(S.sp)renderPins()}
function afterVisData(){renderPins();if(S.view==="list")renderList();else if(S.view==="site"){const s=getSite(S.sel);if(s)renderVis(s)}}
function latestReport(siteId,maxH=48){const r=S.reports.find(x=>x.site_id===siteId);return r&&(Date.now()-Date.parse(r.created_at))<maxH*3600e3?r:null}
function visBadge(s){const r=latestReport(s.id);return r?`<span class="vbadge" title="Sikt rapportert ${esc(ago(r.created_at))}">${fnum(r.vis,1)} m</span>`:""}
function spSiteSet(){return new Set(S.catches.filter(c=>c.species===S.sp).map(c=>c.site_id))}

/* catch editor in log form */
function catchEditorHTML(){return `<div class="catchEd"><label style="margin-top:12px">Fangst og arter sett</label><div id="cRows"></div><button type="button" class="btn ghost" id="cAdd" style="padding:3px 8px;margin-top:4px">+ Legg til art</button>
  <datalist id="spList">${[...new Set([...S.catches.map(c=>c.species),...SPECIES])].sort((a,b)=>a.localeCompare(b,"nb")).map(x=>`<option value="${esc(x)}">`).join("")}</datalist></div>`}
function addCatchRow(){const d=document.createElement("div");d.className="crow";
  d.innerHTML=`<input type="text" list="spList" class="cSp" placeholder="Art" aria-label="Art"><select class="cKind" aria-label="Fanget eller sett"><option value="sett">Sett</option><option value="fanget">Fanget</option></select><input type="number" class="cCnt" min="1" value="1" aria-label="Antall" title="Antall"><input type="number" class="cSize" min="0" step="1" placeholder="cm" aria-label="Største lengde i cm" title="Største lengde, cm"><button type="button" class="btn ghost" aria-label="Fjern">×</button>`;
  d.querySelector("button").onclick=()=>d.remove();$("#cRows").appendChild(d);d.querySelector(".cSp").focus()}
function wireCatchEditor(){const b=$("#cAdd");if(b)b.onclick=addCatchRow}
function readCatchRows(){return [...document.querySelectorAll("#cRows .crow")].map(r=>({species:normSp(r.querySelector(".cSp").value),kind:r.querySelector(".cKind").value,count:Math.max(1,Math.round(num(r.querySelector(".cCnt").value)??1)),size_cm:num(r.querySelector(".cSize").value)})).filter(c=>c.species)}
async function afterLogSaved(s,log,catches){
  const warn=[];
  if(catches.length){const {error}=await sb.from("catches").insert(catches.map(c=>({...c,log_id:log.id,site_id:s.id,date:log.date,author:S.user.id,author_name:S.me.name})));if(error)warn.push("Fangst ble ikke lagret: "+tableErr(error,"catch.sql"))}
  if(log.vis!=null&&log.date===today()){const {error}=await sb.from("vis_reports").insert({site_id:s.id,vis:log.vis,note:"Fra dykkelogg",author:S.user.id,author_name:S.me.name});if(error&&!/finnes ikke/.test(tableErr(error,"")))warn.push("Siktrapport: "+errMsg(error))}
  return warn;
}
function catchesHTML(logId){const L=S.catches.filter(c=>c.log_id===logId);if(!L.length)return"";
  const f=k=>L.filter(c=>c.kind===k).map(c=>`${c.count>1?c.count+" ":""}${esc(c.species.toLocaleLowerCase("nb"))}${c.size_cm!=null?` (${fnum(c.size_cm)} cm)`:""}`).join(", ");
  const a=f("fanget"),b=f("sett");return `<div class="m">${a?`Fanget: ${a}`:""}${a&&b?"<br>":""}${b?`Sett: ${b}`:""}</div>`}
function renderSpecies(){
  const el=$("#speciesBox");if(!el)return;const s=getSite(S.sel);if(!s){el.innerHTML="";return}
  const L=S.catches.filter(c=>c.site_id===s.id);
  if(!L.length){el.innerHTML=S.catchErr?`<p class="small err">${esc(S.catchErr)}</p>`:"";return}
  const dives=Math.max(1,s.logCount||new Set(L.map(c=>c.log_id)).size),by={};
  for(const c of L){const o=by[c.species]||(by[c.species]={sp:c.species,logs:new Set(),caught:0,seen:0,max:null,last:"",months:new Array(12).fill(0)});
    o.logs.add(c.log_id);if(c.kind==="fanget")o.caught+=c.count;else o.seen+=c.count;if(c.size_cm!=null)o.max=Math.max(o.max??0,c.size_cm);if((c.date||"")>o.last)o.last=c.date||"";if(c.date)o.months[+c.date.slice(5,7)-1]++}
  const rows=Object.values(by).sort((a,b)=>b.logs.size-a.logs.size||a.sp.localeCompare(b.sp,"nb"));
  const mstrip=m=>`<svg width="60" height="10" aria-hidden="true">${m.map((v,i)=>`<rect x="${i*5}" y="${v?0:6}" width="4" height="${v?10:4}" rx="1" fill="${v?"var(--alpha)":"var(--line)"}"/>`).join("")}</svg>`;
  el.innerHTML=`<div class="logs"><h3>Arter her</h3><table class="sptab"><thead><tr><th>Art</th><th>Sett i</th><th>Fanget</th><th>Største</th><th title="Måneder arten er registrert, jan til des">Måned</th></tr></thead><tbody>
    ${rows.map(o=>`<tr><td>${esc(o.sp)}</td><td>${o.logs.size}/${dives} dykk</td><td>${o.caught||"–"}</td><td>${o.max!=null?fnum(o.max)+" cm":"–"}</td><td>${mstrip(o.months)}</td></tr>`).join("")}</tbody></table></div>`;
}

/* visibility reports in site panel */
function renderVis(s){
  const el=$("#visBox");if(!el)return;
  const R=S.reports.filter(r=>r.site_id===s.id).slice(0,3),r0=R[0],fresh=r0&&(Date.now()-Date.parse(r0.created_at))<48*3600e3;
  el.innerHTML=`<div class="visq">${r0?`<p style="margin:0 0 6px"><strong class="vbig${fresh?"":" old"}">Sikt ${fnum(r0.vis,1)} m</strong> <span class="small">${esc(ago(r0.created_at))}, ${r0.author===S.user.id?"deg":esc(r0.author_name||"et medlem")}${r0.note?`: ${esc(r0.note)}`:""}</span></p>`:`<p class="small" style="margin:0 0 6px">Ingen siktrapport de siste 14 dagene.</p>`}
    ${R.length>1?`<p class="small" style="margin:0 0 6px">Før: ${R.slice(1).map(r=>`${fnum(r.vis,1)} m ${esc(ago(r.created_at))}`).join(", ")}</p>`:""}
    <form class="f vform" id="vForm"><input type="number" id="vVis" min="0" step="0.5" placeholder="Sikt (m)" aria-label="Sikt i meter" required><input type="text" id="vNote" placeholder="Kommentar (valgfritt)" aria-label="Kommentar"><button class="btn primary" id="vSave">Rapporter sikt nå</button></form>
    ${S.visErr?`<p class="small err">${esc(S.visErr)}</p>`:""}<div class="err" id="vErr"></div></div>`;
  $("#vForm").onsubmit=async e=>{e.preventDefault();const v=num($("#vVis").value);if(v==null)return;$("#vSave").disabled=true;
    const {error}=await sb.from("vis_reports").insert({site_id:s.id,vis:v,note:$("#vNote").value.trim(),author:S.user.id,author_name:S.me.name});
    if(error){$("#vErr").textContent="Kunne ikke lagre: "+tableErr(error,"catch.sql");$("#vSave").disabled=false;return}
    await loadReports()};
}

/* list view: species filter + feed */
function renderSpWrap(){const el=$("#spWrap");if(!el)return;
  const cnt={};for(const c of S.catches){(cnt[c.species]||(cnt[c.species]=new Set())).add(c.site_id)}
  const sp=Object.keys(cnt).sort((a,b)=>a.localeCompare(b,"nb"));
  if(!sp.length){el.innerHTML="";if(S.sp){S.sp="";renderPins()}return}
  el.innerHTML=`<select id="spSel" class="spsel" aria-label="Vis steder med art"><option value="">Alle arter</option>${sp.map(x=>`<option value="${esc(x)}" ${x===S.sp?"selected":""}>${esc(x)} (${cnt[x].size} ${cnt[x].size===1?"sted":"steder"})</option>`).join("")}</select>`;
  $("#spSel").onchange=e=>{S.sp=e.target.value;renderList();renderPins()};
}
function renderVisFeed(){const el=$("#visFeed");if(!el)return;
  const seen=new Set(),rows=[];for(const r of S.reports){if(seen.has(r.site_id))continue;const s=getSite(r.site_id);if(!s)continue;seen.add(r.site_id);if(Date.now()-Date.parse(r.created_at)<72*3600e3)rows.push([r,s])}
  el.innerHTML=rows.length?`<div class="feed"><h3>Siste sikt</h3>${rows.slice(0,6).map(([r,s])=>`<button class="frow" data-site="${esc(s.id)}"><b>${fnum(r.vis,1)} m</b> ${esc(s.name)} <span class="small">${esc(ago(r.created_at))}${r.author===S.user.id?"":", "+esc(r.author_name||"")}</span></button>`).join("")}</div>`:"";
  el.querySelectorAll("[data-site]").forEach(b=>b.onclick=()=>{openSite(b.dataset.site);const o=chartSites().find(o=>o.s.id===b.dataset.site);if(o){if(isLive())S.lmap.setView(o.p,Math.max(S.lmap.getZoom(),13));else centerOn(o.p[0],o.p[1])}});
}
function mobileReveal(){try{if(window.matchMedia("(max-width:860px)").matches)panel.scrollIntoView({behavior:"smooth",block:"start"})}catch(e){}}

/* ---------- boot ---------- */
(function boot(){
  if(!CFG.SUPABASE_URL||CFG.SUPABASE_URL.includes("YOUR-PROJECT")||!CFG.SUPABASE_KEY||CFG.SUPABASE_KEY.includes("PASTE")){authScreen("config");return}
  if(!window.supabase||!window.L){authScreen("config");$("#authBox p").textContent="Kunne ikke laste kartbibliotekene. Sjekk internettforbindelsen og last siden på nytt.";return}
  sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY);
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==="INITIAL_SESSION"||ev==="SIGNED_IN"&&!S.started||ev==="SIGNED_OUT"){setTimeout(()=>onSession(session),0)}
  });
})();
</script>
